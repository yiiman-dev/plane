name: Deploy Staging

# Builds every Plane image from the pushed commit, pushes them to GHCR as :staging
# (and :sha-<commit>), then calls the Dokploy compose webhook to redeploy staging.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: plane-backend
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - image: plane-frontend
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - image: plane-admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - image: plane-space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - image: plane-live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - image: plane-proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:staging
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=staging-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.image }}

  deploy:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Redeploy staging stack on Dokploy
        env:
          DOKPLOY_STAGING_WEBHOOK_URL: ${{ secrets.DOKPLOY_STAGING_WEBHOOK_URL }}
        run: |
          set -eu
          : "${DOKPLOY_STAGING_WEBHOOK_URL:?Add the DOKPLOY_STAGING_WEBHOOK_URL repository secret}"
          # Dokploy's compose webhook redeploys the staging stack. The compose pins pull_policy: always,
          # so the :staging images built above are pulled on every deploy.
          curl -fsS -X POST "$DOKPLOY_STAGING_WEBHOOK_URL" -H "Content-Type: application/json" -d '{}'
          echo "Dokploy staging deploy requested for ${GITHUB_SHA}"
